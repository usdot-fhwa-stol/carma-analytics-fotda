name: CARMA Platform ROS2 Script Python Unit Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, master, release/*]

jobs:
  test_and_sonar:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy matplotlib pyYAML scipy
        # Set Locale before setting up ROS2 repository
        sudo apt-get update && sudo apt-get install locales && \
             locale-gen en_US en_US.UTF-8 && \
             update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 && \
             export LANG=en_US.UTF-8
        
        # Set up sources before installing ROS2
        sudo apt-get install -y software-properties-common && \
             sudo add-apt-repository universe
        
        # Installing the ros2-apt-source package will configure ROS 2 repositories
        export ROS_DISTRO=humble
        sudo apt-get update && \
             export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F'"' '{print $4}') && \
             curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo $VERSION_CODENAME)_all.deb" && \
             sudo apt-get install -y /tmp/ros2-apt-source.deb && \
             sudo rm /tmp/ros2-apt-source.deb

        # Install ROS2 Bag analysis dependencies
        sudo apt-get update
        sudo apt-get install -y ros-humble-rosbag2* ros-humble-rclpy*
        # Configure PYTHONPATH to have modules be found
        export PYTHONPATH=$PYTHONPATH:/opt/ros/humble/local/lib/python3.10/dist-packages
        export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/src/carma-platform

    - name: Run tests
      run: |
        source /opt/ros/humble/setup.bash
        python -m pytest src/carma-platform/test --cov=. --cov-report=xml:./coverage.xml --junitxml=./test-results.xml --cov-context=test

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dproject.settings=.sonarqube/sonar-project.properties

    - name: Check Quality Gate
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
