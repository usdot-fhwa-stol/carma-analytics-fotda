name: Python Unit Tests and Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, master, arc-54-control-analysis-scripts-run-all-crosstrack] #TODO

jobs:
  test_and_sonar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy matplotlib
        # Add the ROS2 GPG key
        sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg

        # Add the repository to sources list
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
 
        sudo apt-get update
        sudo apt-get install -y ros-humble-rosbag2-py ros-hubmle-rclpy

    - name: Run tests
      run: |
        cd src/carma-analytics-fotda/src/carma-platform
        python -m pytest test --cov=. --cov-report=xml --junitxml=test-results.xml

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=your-sonar-organization
          -Dsonar.projectKey=your-project-key
          -Dsonar.python.coverage.reportPaths=src/carma-analytics-fotda/src/carma-platform/coverage.xml
          -Dsonar.python.xunit.reportPath=src/carma-analytics-fotda/src/carma-platform/test-results.xml

    - name: Check Quality Gate
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}