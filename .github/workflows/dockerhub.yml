name: Docker Hub build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - "release/*"
    tags:
      - "carma-system-*"

permissions:
  contents: read

jobs:
  cdasim-data-analysis:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      runner: ubuntu-latest-8-cores
      file: src/cdasim_data_analysis_scripts/docker/Dockerfile
      # The reusable workflow prepends usdotfhwastoldev,
      # usdotfhwastolcandidate, or usdotfhwastol for the current Git ref.
      image_name: cdasim-data-analysis
      tag_name_suffix: humble
      remove_suffix: true
